plugins { id 'java-library' }

description = 'Servlet-like HTTP API built on Neta.'

dependencies {
    api project(':neta-core')
    api project(':neta-codec-http')
    api "net.hasor:cobble-all:${property('lib.cobble')}"

    testImplementation project(':nhttp-server')
    testImplementation "junit:junit:${property('lib.junit')}"
    testImplementation "com.squareup.okhttp3:okhttp:${property('lib.okhttp')}"
}
