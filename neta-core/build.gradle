plugins { id 'java-library'; id 'maven-publish' }

ext.pomName = 'Neta Core'
description = 'High performance asynchronous network application framework.'

dependencies {
    api "net.hasor:cobble-all:${property('lib.cobble')}"
    compileOnly "org.bouncycastle:bcpkix-jdk15on:${property('lib.bouncycastle')}"
    compileOnly "org.bouncycastle:bcprov-jdk15on:${property('lib.bouncycastle')}"
    compileOnly "org.bouncycastle:bctls-jdk15on:${property('lib.bouncycastle')}"

    testImplementation "junit:junit:${property('lib.junit')}"
}

def legacyTlsSecurityProperties = layout.projectDirectory.file('src/test/resources/ssl/legacy-protocols.security')

tasks.named('test', Test) {
    inputs.file(legacyTlsSecurityProperties)
    jvmArgs "-Djava.security.properties=${legacyTlsSecurityProperties.asFile.toURI()}"
}
